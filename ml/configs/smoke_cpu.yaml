# SMALL-SMOKE: proves the whole pipeline runs on a weak CPU machine in about a minute. Results are meaningless.
# Run:  python -m ml.training.train --config ml/configs/smoke_cpu.yaml
#       python -m ml.evaluation.evaluate --config ml/configs/smoke_cpu.yaml
exp_id: SMOKE_lfcc_cnn_cpu
data:
  train_manifests: [data/manifests/vaanishield_v1.csv]
  data_root: null                     # null -> $VAANI_DATA_ROOT or <repo>/data ; or pass --data-root
  include_sources: [asvspoof2019_la]  # Hindi pool blocked for training (codec shortcut, DATASET_CARD.md)
  max_clips_per_split: {train: 16, dev: 8, test: 8}
  preload_audio: true
  crop_samples: 64600
  num_workers: 1
model:
  kind: lfcc_cnn
  params: {}
train:
  seed: 2026
  device: cpu
  epochs: 1
  batch_size: 4
  grad_accum: 1
  lr_head: 0.001
  weight_decay: 0.0001
  amp: false
  early_stop_patience: 1
calib:
  method: none
output:
  checkpoint_dir: runs/smoke/checkpoints
  results_dir: runs/smoke/results
