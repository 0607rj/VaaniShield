# Repaired Hindi pilot (research/hindi_repair_report.md). Inputs are read-only; outputs go to a NEW location.
#   python -m ml.data.build_hindi_v2 --config ml/configs/hindi_v2_pilot.yaml
#   python -m ml.data.hindi_gate --config ml/configs/hindi_gate.yaml --manifest data/manifests/hindi_v2_pilot.csv
build_id: hindi_v2_pilot
v1_manifest: data/manifests/vaanishield_v1.csv          # its 320 IndicSynth clips are the spoof pool (unchanged files)
indicsynth_metadata_glob: raw/indicsynth_hi/Hindi/*_metadata.csv
kathbath_train_audio_dir: raw/kathbath_hi/kb_data_clean_m4a/hindi/train/audio
kathbath_transcripts_dir: raw/kathbath_hi/_transcripts/kb_data_clean_m4a/hindi
reference_ids: data/manifests/hindi_v2_reference_ids.txt
codec_matching:                     # spoof only: give fakes the same last lossy stage as Kathbath's capture codec
  enabled: true
  encoder: aac
  sample_rate: 44100
  bitrate_kbps: 128                 # Kathbath median measured in the audit (127.4-128.2 kb/s)
holdout_family: freevc              # unseen-family fold (docs/data_flow.md rule 3): FreeVC groups -> test only
split_shares: {train: 0.6, dev: 0.2, test: 0.2}   # of the clips NOT in held-out groups
min_duration_s: 1.0
seed: 2026
output:
  audio_dir: processed/hindi_v2/pilot
  manifest: data/manifests/hindi_v2_pilot.csv
  metadata: data/manifests/hindi_v2_pilot_metadata.jsonl
