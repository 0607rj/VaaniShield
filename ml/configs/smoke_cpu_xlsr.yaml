# XLS-R SMOKE (CPU laptop): frozen XLS-R-300M + light head, 8/4/4 clips, batch 2, 1 epoch. Proves the path works only.
# Needs the pinned XLS-R weights in the HF cache (~1.3 GB, downloaded automatically on first use).
# Run:  python -m ml.training.train --config ml/configs/smoke_cpu_xlsr.yaml
#       python -m ml.evaluation.evaluate --config ml/configs/smoke_cpu_xlsr.yaml
exp_id: SMOKE_xlsr_frozen_cpu
data:
  train_manifests: [data/manifests/vaanishield_v1.csv]
  data_root: null
  include_sources: [asvspoof2019_la]
  max_clips_per_split: {train: 8, dev: 4, test: 4}
  preload_audio: true
  crop_samples: 64600
  num_workers: 1
model:
  kind: xlsr_mlp
  encoder_id: facebook/wav2vec2-xls-r-300m
  encoder_revision: 1a640f32ac3e39899438a2931f9924c02f080a54
  freeze_encoder: true
  unfreeze_top_k: 0
  truncate_after_layer: null
  adapter_dim: 128
train:
  seed: 2026
  device: cpu
  epochs: 1
  batch_size: 2
  grad_accum: 1
  lr_head: 0.001
  lr_encoder: 0.000001
  weight_decay: 0.0001
  amp: false
  early_stop_patience: 1
calib:
  method: none
output:
  checkpoint_dir: runs/smoke/checkpoints
  results_dir: runs/smoke/results
